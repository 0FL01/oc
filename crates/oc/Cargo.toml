[package]
name = "oc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native oc binary: local TUI and headless coding session"

[[bin]]
name = "oc"
path = "src/main.rs"

[features]
auth-fixture = ["oc-adapters/auth-fixture"]

[dependencies]
oc-core = { path = "../oc-core" }
oc-adapters = { path = "../oc-adapters" }
oc-tui = { path = "../oc-tui" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
ratatui.workspace = true
# Mio can discard stdin's edge when SIGWINCH is returned from the same poll.
# Crossterm's level-triggered Unix backend preserves simultaneous resize/input.
crossterm = { workspace = true, features = ["event-stream", "use-dev-tty"] }
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
