[package]
name = "oc-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND AGPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Local terminal UI for oc, bound to oc-core application API plus oc-adapters read-side domain (D12)"

[dependencies]
oc-core = { path = "../oc-core", version = "0.1.0" }
oc-adapters = { path = "../oc-adapters", version = "0.1.0" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm.workspace = true
unicode-normalization = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
pulldown-cmark = { version = "=0.13.0", default-features = false }
tree-sitter = "=0.25.10"
tree-sitter-language = "=0.1.7"
streaming-iterator = "=0.1.9"

[build-dependencies]
cc = "1.2"
lzma-rust2 = { version = "0.20.1", default-features = false, features = ["std", "xz"] }
tar = "0.4"
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
