[package]
name = "oc-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Adapter implementations for oc-core ports: storage, providers, tools, mcp, dcp"

[dependencies]
oc-core = { path = "../oc-core" }
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
anyhow.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
reqwest.workspace = true
rmcp.workspace = true
futures-util = { workspace = true, features = ["sink"] }
fs2.workspace = true
sha2.workspace = true
libc.workspace = true
toml.workspace = true
base64.workspace = true
regex.workspace = true
ignore.workspace = true
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
html5ever = "=0.35.0"
vt100 = "=0.16.2"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
