[package]
name = "oc-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND AGPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Adapter implementations for oc-core ports: storage, providers, tools, mcp, dcp"

[features]
# Non-default local-issuer/request build for AUTH02/AUTH04 binary fixtures only.
auth-fixture = []

[dependencies]
oc-core = { path = "../oc-core", version = "0.2.0" }
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
anyhow.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
reqwest.workspace = true
rmcp.workspace = true
futures-util = { workspace = true, features = ["sink"] }
fs2.workspace = true
sha2.workspace = true
libc.workspace = true
toml.workspace = true
base64.workspace = true
regex.workspace = true
ignore.workspace = true
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
html5ever = "=0.35.0"
vt100 = "=0.16.2"
# Existing locked ANSI parser, with fixed-size OSC retention for untrusted output.
anstyle-parse = { version = "=1.0.0", features = ["core"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
# Code Mode: ECMAScript regular expressions for the native interpreter; no JS host.
regress = { version = "=0.12.0", features = ["utf16"] }
indexmap = "2"
# Event/handler vocabulary; Linux descriptor/task ownership stays in the adapter.
notify = { version = "=8.2.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
